name: Feature request
description: Suggest a new feature or setting.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What do you want?
      description: The feature or the setting.
      placeholder: "Remember the enlarged view size."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The problem it solves, or how you would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get the same result, including macOS features.
